[project]
name = "insurance-premium-prediction-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "avneeshDS", email = "avneeshchaudhary25@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.156.5",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "streamlit>=1.66.0",
]

[project.scripts]
insurance-premium-prediction-app = "insurance_premium_prediction_app:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]
